/* ===== LIVE COUNTERS: uses the board's existing functional elements ===== */
.score-area{
  display:flex !important;
  position:absolute !important;
  right:14px !important; top:68px !important; gap:8px !important;
  z-index:30 !important;
  align-items:stretch !important;
}
.score{
  width:120px !important; height:97px !important;
  border:1px solid #00b7ff99 !important;
  border-radius:10px !important;
  background:rgba(2,9,18,.90) !important;
  box-shadow:0 0 12px #00b7ff32, inset 0 0 12px #000 !important;
  backdrop-filter:blur(3px) !important;
}
.score.t{
  border-color:#ff2447aa !important;
  box-shadow:0 0 12px #ff24472c, inset 0 0 12px #000 !important;
}
.score label{
  font-size:10px !important; letter-spacing:.15em !important;
  font-weight:1000 !important;
  color:#fff !important;
}
.score b{
  font-size:40px !important;
  line-height:1 !important;
}
.reset{
  height:97px !important; padding:0 10px !important;
  border:1px solid #ffd429bb !important;
  border-radius:10px !important;
  background:rgba(3,7,14,.92) !important;
  color:#fff !important;
  font-size:7px !important;
  font-weight:1000 !important;
  box-shadow:0 0 9px #ffd42925, inset 0 0 10px #000 !important;
}

/* Keep the inactive team logo treatment from V5 / Logo Update. */
.team:not(.taken-state) .city,
.team:not(.taken-state) .name{display:none !important}
.team:not(.taken-state) .logo{
  height:88% !important;
  min-height:0 !important;
  max-height:none !important;
  width:100% !important;
}
.team:not(.taken-state) .logo img{
  height:min(88px,88%) !important;
  max-width:120px !important;
  object-fit:contain !important;
  transform:scale(1.18) !important;
}

/* iPad portrait */
@media(max-width:850px) and (orientation:portrait){
  .header{
    height:120px !important;
    flex-basis:120px !important;
  }
  .app:before{top:122px !important}
  .score-area{
    right:8px !important;
    top:12px !important;
    gap:5px !important;
  }
  .score{
    width:70px !important;
    height:62px !important;
  }
  .score label{font-size:6px !important}
  .score b{font-size:24px !important}
  .reset{height:62px !important;font-size:7px !important;padding:0 7px !important}
}

/* Remove all six AL/NL division header strips from the interactive board. */
.division{
  display:none !important;
  height:0 !important;
  min-height:0 !important;
  flex:0 0 0 !important;
  margin:0 !important;
}

/* Remove the bottom legend from the actual interactive board iframe. */
.footer{
